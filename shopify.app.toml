# App custom "PaatJumpsNext" — sync CRM ↔ Shopify: descuentos (promociones),
# pedidos+clientes (lib/crm/shopify-sync.ts) y webhooks del CRM. Los webhooks
# declarados aquí los crea/gestiona Shopify en cada `shopify app deploy` y se
# firman con el client secret de la app (SHOPIFY_WEBHOOK_SECRET).

client_id = "4687182a86e110d0b05f23afb1b8876d"
application_url = "https://checkout.paatjumps.com"
embedded = false
name = "PaatJumpsNext"

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated" ]
  uri = "https://www.paatjumps.com/api/webhooks/shopify"

  # refunds/create → rectificativa (abono) automática en Holded si el pedido
  # ya tenía ticket emitido (lib/holded/credit-notes.ts)
  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "https://www.paatjumps.com/api/webhooks/shopify"

  [[webhooks.subscriptions]]
  topics = [ "checkouts/create", "checkouts/update" ]
  uri = "https://www.paatjumps.com/api/webhooks/shopify"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_merchant_managed_fulfillment_orders: crear fulfillments con tracking
# desde el CRM cuando Packlink genera la etiqueta (lib/crm/packlink-sync.ts).
# read_products: peso real de las variantes para el borrador Packlink.
scopes = "write_discounts,read_discounts,read_orders,read_customers,read_checkouts,read_products,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "http://localhost:3939/callback" ]
